# Ukázková konfigurace pro server nginx (pokud hosting nepoužívá Apache/.htaccess).
# Bezpečnostní hlavičky jsou v souboru nginx-security-headers.conf (shodné s ../.htaccess a ../_headers).
# Cesty a doménu upravte podle svého serveru. Certifikát např. Let's Encrypt (certbot).

server {
    listen 80;
    listen [::]:80;
    server_name reznictvistiborek.cz www.reznictvistiborek.cz;
    return 301 https://www.reznictvistiborek.cz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.reznictvistiborek.cz;

    ssl_certificate     /etc/letsencrypt/live/www.reznictvistiborek.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.reznictvistiborek.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/stiborek-web;
    index index.html;
    charset utf-8;
    server_tokens off;
    error_page 404 /404.html;

    # Typy souborů: novější nginx má .avif i .webmanifest v /etc/nginx/mime.types.
    # Pokud chybí, doplňte je tam (blok „types“ zde by přepsal všechny ostatní typy).

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/xml text/plain;

    # neveřejné soubory
    location ~ ^/(README\.md|_headers|security/) { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/stiborek-security-headers.conf;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/stiborek-security-headers.conf;
    }
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/stiborek-security-headers.conf;
    }
    location ~* \.(avif|webp|jpe?g|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/stiborek-security-headers.conf;
    }
}
