name: Web – build a testy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Vygenerované soubory odpovídají content.json
        run: node tools/build.mjs --check
      - name: Automatické testy
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-vystup.log
      - name: Selhané testy jako poznámka v přehledu běhu
        if: failure()
        run: |
          [ -f test-vystup.log ] || exit 0
          zprava=$(grep -A3 '✖' test-vystup.log | head -60 | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Selhané testy::${zprava}"
